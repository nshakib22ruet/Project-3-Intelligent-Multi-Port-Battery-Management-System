name: Build Smart Battery Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          npm install
          mkdir -p www
          cp Smart_Battery_Dashboard.html www/index.html

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Battery-Tester-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
