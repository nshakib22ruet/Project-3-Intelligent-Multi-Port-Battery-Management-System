
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Node dependencies
        run: npm install

      - name: Prepare dashboard
        run: |
          mkdir -p www
          cp Smart_Battery_Dashboard.html www/index.html

          [ ! -d Images ] || cp -R Images www/
          [ ! -d images ] || cp -R images www/

      - name: Create Android project
        run: npx cap add android --no-interactive

      - name: Copy custom Bluetooth plugin
        run: |
          mkdir -p android/app/src/main/java/com/nshakib22ruet/batterymanagement
          cp native/android/app/src/main/java/com/nshakib22ruet/batterymanagement/BluetoothPlugin.java android/app/src/main/java/com/nshakib22ruet/batterymanagement/

      - name: Register Bluetooth plugin
        run: |
          cp native/android/app/src/main/java/com/ruet/smartbatterytester/MainActivity.java android/app/src/main/java/com/ruet/smartbatterytester/

      - name: Add Bluetooth permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          A = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(path)
          root = tree.getroot()

          permissions = [
              ("android.permission.BLUETOOTH_SCAN", None),
              ("android.permission.BLUETOOTH_CONNECT", None),
              ("android.permission.BLUETOOTH", "30"),
              ("android.permission.BLUETOOTH_ADMIN", "30"),
              ("android.permission.ACCESS_FINE_LOCATION", "30")
          ]

          existing = {
              p.get(A + "name")
              for p in root.findall("uses-permission")
          }

          for name, max_sdk in permissions:
              if name not in existing:
                  p = ET.SubElement(root, "uses-permission")
                  p.set(A + "name", name)
                  if max_sdk:
                      p.set(A + "maxSdkVersion", max_sdk)

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Battery-Management-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
